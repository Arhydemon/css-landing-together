<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiki-гид по CSS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: #ffffff;
      padding: 16px;
      border-bottom: 1px solid #ddd;
    }

    main {
      padding: 16px 0;
    }

    footer {
      background: #ffffff;
      padding: 16px;
      border-top: 1px solid #ddd;
      text-align: center;
      margin-top: 40px;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      background: #222;
      color: white;
      text-decoration: none;
    }

    .card {
      background: white;
      padding: 16px;
      border: 1px solid #ddd;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h1>Wiki-гид по CSS</h1>
  </div>
</header>

<main>
  <div class="container">

    <div class="card">
      Контент
    </div>

    <a href="#" class="btn">Кнопка</a>

  </div>
</main>

<footer>
  <div class="container">
    Подвал
  </div>
</footer>

</body>
</html>
